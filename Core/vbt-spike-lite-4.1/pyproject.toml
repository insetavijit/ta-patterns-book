[project]
name = "vbtspike"
version = "0.6.0"
description = "Backtest runner and DuckDB persistence layer (v6 hardened)"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.1.3",
    "vectorbt>=0.26.2",
    "plotly<6.0.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
vbtspike = "Core.vbtspike.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
