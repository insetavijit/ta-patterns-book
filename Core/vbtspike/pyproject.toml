[project]
name = "vbtspike"
version = "0.1.0"
description = "VectorBT spike backtest runner, trade extraction, and DuckDB persistence engine."
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "vectorbt>=0.26.2",
]

[project.scripts]
vbtspike = "vbtspike.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["Core"]
