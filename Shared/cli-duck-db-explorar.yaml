# DuckDB Explorer CLI Registry
# Tool: duckdb_explorer.py
# Path: Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py

tool:
  name: "duckdb_explorer"
  version: "1.0.0"
  executable: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py"
  description: "Agent-friendly, read-only-by-default CLI tool for inspecting, querying, profiling, and analyzing DuckDB databases."
  global_options:
    - "--output {json,ndjson,table,markdown} : Output format (default: json)"
    - "--limit <n> : Cap on rows returned (default: 1000, 0 disables cap)"
    - "--write : Enable write operations (INSERT/CREATE/DROP). Off by default"
    - "--timeout <sec> : Abort running query after seconds"
    - "--pretty : Pretty-print JSON output"
    - "--arrays : Return rows as arrays instead of objects"
    - "--nl : Emit newline-delimited JSON"
    - "--quiet : Suppress warnings on stderr"

cli:
  - name: "list-tables"
    purpose: "List all tables and views with their respective row counts"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> list-tables [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
      - "--estimate-counts : Fast row estimate via duckdb_tables().estimated_size"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb list-tables"

  - name: "list-schemas"
    purpose: "List all schemas in the database"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> list-schemas"
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb list-schemas"

  - name: "schema"
    purpose: "Display column schema, data types, and nullability for a specific table or view"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> schema <table> [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb schema ohlcv_eurusd_1m_2025"

  - name: "schema-all"
    purpose: "Output column schemas for every table and view in the database in a single call"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> schema-all [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb schema-all"

  - name: "profile"
    purpose: "Combined schema inspection, native column statistics (SUMMARIZE), and sample rows"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> profile <table> [options]"
    options:
      - "-n <count> : Number of sample rows to include (default: 5)"
      - "--schema <name> : Target catalog schema (default: main)"
      - "--estimate-counts : Use catalog row estimate"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb profile ohlcv_eurusd_1m_2025"

  - name: "sample"
    purpose: "Preview N sample rows from a table or view"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> sample <table> [--limit N]"
    options:
      - "--limit <n> : Number of rows to preview (default: 1000)"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb sample ohlcv_eurusd_1m_2025 --limit 5"

  - name: "summarize"
    purpose: "Compute comprehensive per-column summary statistics via DuckDB's native SUMMARIZE"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> summarize <table> [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb summarize ohlcv_eurusd_1m_2025"

  - name: "row-count"
    purpose: "Get exact or estimated row count for a table"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> row-count <table> [options]"
    options:
      - "--estimate-counts : Fast row estimate via duckdb_tables()"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb row-count ohlcv_eurusd_1m_2025"

  - name: "query"
    purpose: "Execute arbitrary SQL query (read-only unless --write is specified)"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> query \"<sql>\" [options]"
    options:
      - "--file <path> : Read SQL text from a file instead of positional argument"
      - "--dry-run : Print what would run without executing"
      - "--write : Allow mutating SQL statements (CREATE/INSERT/UPDATE/DROP)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb query \"SELECT count(*) FROM ohlcv_eurusd_1m_2025\""

  - name: "pandas"
    purpose: "Execute arbitrary Pandas Python expressions directly on target table or SQL query DataFrame ('df')"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> pandas <table> \"<pandas_expr>\" [options]"
    options:
      - "--query <sql> : Custom SQL query to produce the input DataFrame instead of reading table"
      - "--expr <expr> : Explicit flag alias for the Pandas expression"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb pandas ohlcv_eurusd_1m_2025 \"df.describe()\""

  - name: "explain"
    purpose: "Show query plan or execution stats for a SQL statement"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> explain \"<sql>\" [options]"
    options:
      - "--analyze : Use EXPLAIN ANALYZE to include real execution stats"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb explain \"SELECT * FROM ohlcv_eurusd_1m_2025 LIMIT 10\""

  - name: "validate-sql"
    purpose: "Check SQL syntax and catalog validity without executing it"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> validate-sql \"<sql>\""
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb validate-sql \"SELECT open, high, low, close FROM ohlcv_eurusd_1m_2025\""

  - name: "search-columns"
    purpose: "Find tables and column names matching a keyword"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> search-columns <keyword> [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb search-columns pnl"

  - name: "search-values"
    purpose: "Search for specific data values across column contents in tables"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> search-values <term> [options]"
    options:
      - "--table <table> : Restrict search to one table (default: all tables in schema)"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb search-values EURUSD"

  - name: "diff-schema"
    purpose: "Compare table and column structure against another DuckDB file"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> diff-schema --other <other_db> [options]"
    options:
      - "--other <path> : Path to DuckDB file to compare against (required)"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py db1.duckdb diff-schema --other db2.duckdb"

  - name: "export"
    purpose: "Export a table or arbitrary query result to CSV, JSON, NDJSON, or Parquet"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> export [options]"
    options:
      - "--table <table> : Target table to export in full"
      - "--query <sql> : Arbitrary SELECT query to export"
      - "--format {csv,json,ndjson,parquet} : Output data format"
      - "--out <path> : Destination file path (prints stdout if omitted for json/ndjson)"
      - "--offset <n> : Skip rows before exporting (for paging)"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb export --table ohlcv_eurusd_1m_2025 --format parquet --out export.parquet"

  - name: "import"
    purpose: "Load a CSV, Parquet, or JSON file into a new table (requires --write)"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> --write import <file> <table> [options]"
    options:
      - "--replace : Replace table if it already exists"
      - "--delimiter <char> : CSV field delimiter override"
      - "--no-header : CSV file has no header row"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/test.duckdb --write import data.csv new_table"

  - name: "stats"
    purpose: "High-level database stats (file size, table count, total rows)"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> stats [options]"
    options:
      - "--estimate-counts : Fast catalog row count estimate"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb stats"

  - name: "checksum"
    purpose: "Order-independent content hash of a table for integrity verification"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> checksum <table> [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb checksum ohlcv_eurusd_1m_2025"

  - name: "indexes"
    purpose: "List indexes and constraints defined on a table"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> indexes <table> [options]"
    options:
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb indexes ohlcv_eurusd_1m_2025"

  - name: "list-extensions"
    purpose: "List loaded and available DuckDB extensions"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> list-extensions"
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py :memory: list-extensions"

  - name: "resample"
    purpose: "Resample an OHLCV 1-minute table/view to target timeframe (5m, 15m, 1h, 1d) and create a DuckDB VIEW"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> --write resample --src-table <table> --resample <tf> [options]"
    options:
      - "--src-table <table> : Source 1-minute OHLCV table/view name (required)"
      - "--resample <tf> : Target timeframe (e.g., 5m, 15m, 1h, 1d) (required)"
      - "--view <name> : Name of the VIEW to create (defaults to {src_table}_{timeframe})"
      - "--schema <name> : Target catalog schema (default: main)"
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb --write resample --src-table ohlcv_eurusd_1m_2025 --resample 5m"

  - name: "health-check"
    purpose: "Verify the target file is a valid, uncorrupted, queryable DuckDB database"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py <db> health-check"
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py Shared/Data/Ohlcv_2325Eurusd.duckdb health-check"

  - name: "version"
    purpose: "Print tool and DuckDB library versions"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py :memory: version"
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py :memory: version"

  - name: "describe"
    purpose: "Emit the tool's full command and flag surface as JSON for agent self-discovery"
    usage: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py :memory: describe"
    options: []
    example: "uv run python Utils/util-python-uv-toolset/utils/duckdb-explorar-tool/duckdb_explorer.py :memory: describe"
