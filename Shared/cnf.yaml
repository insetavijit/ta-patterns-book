# Project Directory Structure & File Placement Configuration

project:
  name: ta-patterns-book
  package_manager: uv

paths:
  trash:
    path: "__trash"
    purpose: "Temporary discard area for deleted or draft items before cleanup."
  
  tmp:
    path: ".tmp"
    purpose: "Scratchpads, temporary test outputs, and transient build artifacts."

  core:
    path: "Core"
    purpose: "Primary domain models, technical analysis algorithms, and core business logic."

  docs:
    root: "DOCs"
    agents:
      path: "DOCs/agents"
      dir_tree: "DOCs/agents/dir-tree.md"
      purpose: "Agent operational docs and project hierarchy references."
    artifacts:
      adrs:
        path: "DOCs/Artifacts/ADRs"
        purpose: "Architecture Decision Records (ADR-xxx.md)."
      bugs:
        path: "DOCs/Artifacts/BUGs"
        purpose: "Bug reports, post-mortems, and issue tracking notes."
      plans:
        path: "DOCs/Artifacts/PLans"
        purpose: "Implementation plans, task roadmaps, and execution specs."
    guides:
      path: "DOCs/GUIDs"
      purpose: "User guides, API reference docs, and setup instructions."
    notes:
      root: "DOCs/NOTEs"
      goal_1:
        path: "DOCs/NOTEs/GOAL-1"
        researches: "DOCs/NOTEs/GOAL-1/researches"
        outcome: "DOCs/NOTEs/GOAL-1/outcome.md"
        purpose: "Notes, benchmarks, and research outcomes for GOAL-1."
      goal_2:
        path: "DOCs/NOTEs/GOAL-2"
        purpose: "Notes, benchmarks, and research outcomes for GOAL-2."
      goal_3:
        path: "DOCs/NOTEs/GOAL-3"
        purpose: "Notes, benchmarks, and research outcomes for GOAL-3."

  notebooks:
    path: "Notebooks"
    purpose: "Jupyter / Marimo notebooks for exploratory analysis and visualization."

  shared:
    root: "Shared"
    inputs:
      path: "Shared/INPs"
      purpose: "Raw input datasets, market data CSVs/Parquet, and external reference files."
    outputs:
      root: "Shared/OUTs"
      png: "Shared/OUTs/png"
      duckdb: "Shared/OUTs/duckdb"
      purpose: "Generated reports, exported charts, PNG figures, DuckDB backtest outputs, processed metrics, and trained models."
    data:
      path: "Shared/Data"
      primary_db: "Shared/Data/Ohlcv_2325Eurusd.duckdb"
      secondary_db: "Shared/Data/Ohlcv_2325Eurusd.duckdb"
      backtest_db: "Shared/Data/Ohlcv_2325Eurusd.duckdb"
      purpose: "Shared static data fixtures and reference tables."
    strategies:
      path: "Shared/strategies"
      helpers: "Shared/strategies/_helpers"
      active_strategy_file: "Shared/strategies/classic_floor_mod_v6/classic_floor_mod_v6_1.py"
      active_strategy_name: "classic_floor_mod_v6_1"
      active_db_path: "Shared/Data/Ohlcv_2325Eurusd.duckdb"
      active_table: "ohlcv_eurusd_1m_2025"
      purpose: "Dedicated focus strategy file and active database targets to prevent collateral edits. Each version lives in its own subdirectory (classic_floor_mod_v<N>/)."
    config:
      path: "Shared/cnf.yaml"
      purpose: "Central project paths and environment configuration."

  tests:
    path: "Tests"
    purpose: "Unit, integration, and backtest test suites."

  utils:
    path: "Utils"
    purpose: "Helper utilities, common math/date functions, and data transformations."

# Project Tools & Executables Reference
tools:
  loss_profile:
    path: "Core/ta_patterns_book/loss_profile"
    purpose: "Strategy loss profiler, monthly, weekly, duration, & pattern distribution reporter."
  duckdb_explorer:
    path: "Utils/duckdb-explorar-tool/duckdb_explorer.py"
    purpose: "Agent-friendly CLI for inspecting, querying, profiling, searching, and running Pandas operations on DuckDB databases."
  tradebook_tool:
    path: "Core/trade_book_charts"
    purpose: "SmartGrid-packed trade playbook PNG canvas generator and standalone chart packing layout engine (UV workspace package)."
  tools_info:
    path: "Utils/tools-info.md"
    purpose: "Authoritative documentation index for Gemini/Antigravity agents to discover and execute Utils CLI tools."
  vbtspike:
    path: "Core/vbtspike"
    purpose: "VectorBT spike backtest engine, telemetry derivation, and DuckDB persistence."
  post_test_enrichment:
    path: "Shared/strategies/_helpers/post-test-enrichment.py"
    purpose: "Post-backtest DuckDB database enrichment pipeline (candlestick patterns & schema verification)."

# VectorBT Spike Engine Runtime Configuration
vbtspike:
  duckdb_path: "Shared/Data/Ohlcv_2325Eurusd.duckdb"
  results_dir: "Shared/OUTs/duckdb"
  max_cache_age_default: "24h"
  log_level: "INFO"
  backup:
    dir: "Shared/OUTs/duckdb/backups"
    keep_last: 5

# Post-Test Database Enrichment Pipeline Configuration
post_test_enrichment:
  status: "on"                 # "on" | "off" (master switch to auto-enrich after backtests)
  enabled: true
  runner: "Shared/strategies/_helpers/post-test-enrichment.py"
  scripts:
    - "Shared/strategies/_helpers/candel_patterns.py"
  with_info: false             # Set to true to automatically generate column metadata 'info' table
  force: false                 # Overwrite existing enrichment tables if present

# Terminal & Stdio Display Settings
display:
  formatter: "rich"
  default_dump: "txt"          # Default output dump file format ('txt')
  table:
    box: null                  # Borderless table (no box borders)
    show_header: true
    header_style: "bold cyan"
    show_edge: false
    pad_edge: false


# Quick File Routing Table (AI & Developer Placement Reference)
file_routing:
  - pattern: "ADR-*.md"
    destination: "paths.docs.artifacts.adrs"
  - pattern: "BUG-*.md"
    destination: "paths.docs.artifacts.bugs"
  - pattern: "PLAN-*.md"
    destination: "paths.docs.artifacts.plans"
  - pattern: "*_research.md"
    destination: "paths.docs.notes.goal_1.researches"
  - pattern: "*.csv, *.parquet, *.json (inputs)"
    destination: "paths.shared.inputs"
  - pattern: "*.png, *.jpg, *.svg (rendered charts)"
    destination: "paths.shared.outputs.png"
  - pattern: "*.duckdb (backtest outputs)"
    destination: "paths.shared.outputs.duckdb"
  - pattern: "test_*.py"
    destination: "paths.tests"
  - pattern: "*.ipynb"
    destination: "paths.notebooks"
