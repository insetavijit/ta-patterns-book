# Hugging Face Upload Tool CLI Registry
# Tool: upload-to-hf.py
# Path: Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py

tool:
  name: "upload-to-hf"
  version: "1.0.0"
  executable: "uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py"
  description: "Upload local files, DuckDB database snapshots, model weights, and artifacts to Hugging Face Hub repositories."
  output_formats: ["text"]
  default_execution: "uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py"
  authentication: "Requires HF_TOKEN environment variable or prior login via `huggingface-cli login`."

cli:
  - name: "upload-file"
    purpose: "Upload local file or DuckDB database to Hugging Face Hub repository"
    usage: "uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py --target <path> [options]"
    options:
      - "--target <path> : Path to local file to upload (e.g., Shared/Data/Ohlcv_2325Eurusd.duckdb) (required)"
      - "--repo <id> : Hugging Face repo ID in form 'username/repo' (default: Sarkaravijit123/my-tst-data)"
      - "--path-in-repo <path> : Destination path inside repo (defaults to basename of --target)"
      - "--repo-type {dataset,model,space} : Hugging Face repository type (default: dataset)"
      - "--commit-message <msg> : Commit message for the upload (auto-generated if omitted)"
      - "--token <token> : Hugging Face API token override (defaults to HF_TOKEN env var)"
      - "--dry-run : Validate inputs and print execution upload plan without uploading"
    example: 'uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py --target "Shared/Data/Ohlcv_2325Eurusd.duckdb" --repo "Sarkaravijit123/my-tst-data" --repo-type dataset --commit-message "Upload EURUSD DuckDB dataset"'

  - name: "upload-dry-run"
    purpose: "Validate local file existence, repository configuration, and target path without executing network upload"
    usage: "uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py --target <path> --dry-run [options]"
    options:
      - "--target <path> : Path to local file to validate (required)"
      - "--repo <id> : Target Hugging Face repo ID"
      - "--dry-run : Validate and print plan without network upload"
    example: 'uv run python Utils/util-python-uv-toolset/utils/upload-to-hf-tool/upload-to-hf.py --target "Shared/Data/Ohlcv_2325Eurusd.duckdb" --dry-run'
