# Tree Tool CLI Registry
# Tool: tree.py
# Path: Utils/util-python-uv-toolset/utils/tree-tool/tree.py

tool:
  name: "tree"
  version: "1.2.0"
  executable: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py"
  description: "Universal project file tree, listing, and dependency discovery tool supporting extension filters, glob matches, and codebase cross-reference inspection via --relate."
  output_formats: ["text", "tree", "table", "json"]
  default_execution: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py"

cli:
  - name: "tree-list"
    purpose: "Print plain list of relative paths for all Python (.py) files in workspace"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py [options]"
    options:
      - "--root, -r <dir> : Root directory to search (defaults to project workspace root)"
      - "--all, -a : Include all files without excluding .venv, __pycache__, or hidden directories"
      - "--exclude <names...> : Additional directory names to exclude"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py"

  - name: "tree-relate"
    purpose: "Inspect codebase cross-references and dependency mentions of a file or script"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --relate <path> [options]"
    options:
      - "--relate <path> : Target file, script path, or module name to search for references (required)"
      - "--py : Restrict references to Python (.py) files only"
      - "--strict, -s : Only match exact relative path or filename, skipping bare symbol/module stem"
      - "--table : Render borderless Rich summary table with line numbers and matched snippets"
      - "--tree : Render visual tree of referencing files"
      - "--json : Output structured JSON data of all references"
      - "--count : Output count of referencing files"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --relate Shared/strategies/classic_floor_mod_v6/CFMV0601B.py --py"

  - name: "tree-find"
    purpose: "Find and list relative paths for files matching a specific extension (e.g., .ipynb, .yaml, .duckdb)"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --find <ext> [options]"
    options:
      - "--find, -f <ext> : File extension to search for (e.g., .ipynb, .parquet, .yaml)"
      - "--tree : Render matches as visual ASCII/Rich directory tree"
      - "--table : Render matches in borderless table with lines & size"
      - "--json : Output matches as JSON array"
      - "--count : Output single integer count of matched files"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --find .ipynb"

  - name: "tree-match"
    purpose: "Find and list relative paths for files matching a filename glob pattern (e.g., 'cli-*.yaml', '*test*')"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --match <pattern> [options]"
    options:
      - "--match, -m <glob> : Filename glob pattern to match (e.g., 'cli-*.yaml', '*.ex5')"
      - "--tree : Render matches as visual ASCII/Rich directory tree"
      - "--table : Render matches in borderless table with lines & size"
      - "--json : Output matches as JSON array"
      - "--count : Output single integer count of matched files"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --match \"cli-*.yaml\""

  - name: "tree-visual"
    purpose: "Render visual ASCII/Rich directory tree showing files and package hierarchies"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --tree [options]"
    options:
      - "--tree, -t : Render visual directory tree structure"
      - "--find, -f <ext> : Filter visual tree by file extension"
      - "--match, -m <glob> : Filter visual tree by glob pattern"
      - "--relate <path> : Render tree of files referencing the specified path"
      - "--py : Filter to Python files only"
      - "--root, -r <dir> : Target subdirectory to render as tree (e.g., Core, Shared)"
      - "--exclude <names...> : Additional directory names to exclude"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --tree --root Core"

  - name: "tree-table"
    purpose: "Render borderless Rich summary table with line counts, file sizes, and totals"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --table [options]"
    options:
      - "--table : Render borderless tabular summary with line count and file size stats"
      - "--find, -f <ext> : Filter table by file extension"
      - "--match, -m <glob> : Filter table by glob pattern"
      - "--relate <path> : Render table of references to target path"
      - "--py : Filter to Python files only"
      - "--root, -r <dir> : Restrict table report to specific directory root"
      - "--exclude <names...> : Additional directory names to exclude"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --table"

  - name: "tree-json"
    purpose: "Output machine-readable JSON array of relative file paths for agent consumption"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --json [options]"
    options:
      - "--json, -j : Output raw JSON array of file paths"
      - "--find, -f <ext> : Filter JSON array by file extension"
      - "--match, -m <glob> : Filter JSON array by glob pattern"
      - "--relate <path> : Output JSON reference data"
      - "--py : Filter to Python files only"
      - "--root, -r <dir> : Target search directory"
      - "--exclude <names...> : Additional directory names to exclude"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --json"

  - name: "tree-count"
    purpose: "Output single integer count of matched files in the target directory"
    usage: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --count [options]"
    options:
      - "--count, -c : Print only the total count of files"
      - "--find, -f <ext> : Count files by extension"
      - "--match, -m <glob> : Count files by glob pattern"
      - "--relate <path> : Count referencing files"
      - "--py : Filter to Python files only"
      - "--root, -r <dir> : Target search directory"
    example: "uv run python Utils/util-python-uv-toolset/utils/tree-tool/tree.py --count"
