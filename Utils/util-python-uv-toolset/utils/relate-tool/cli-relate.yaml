# Relate Tool CLI Registry
# Tool: relate.py
# Path: Utils/util-python-uv-toolset/utils/relate-tool/relate.py

tool:
  name: "relate"
  version: "1.0.0"
  executable: "uv run python relate.py"
  description: "Codebase cross-reference and dependency finder to discover which files reference, import, or mention a target script path or filename."
  output_formats: ["table", "plain", "json"]
  default_execution: "uv run python relate.py --path <target_path>"

cli:
  - name: "relate-table"
    purpose: "Inspect all project references and mentions of a file with line numbers and snippets"
    usage: "uv run python relate.py --path <path> [options]"
    options:
      - "--path, -p <path> : Target script path, filename, or module name to search for (required)"
      - "--strict, -s : Only match full path or filename, skipping bare stem/symbol names"
      - "--table : Render borderless Rich summary table with line numbers and matched snippets"
      - "--root, -r <dir> : Root directory to search (defaults to project workspace root)"
    example: "uv run python relate.py --path Shared/strategies/classic_floor_mod_v6/CFMV0601B.py"

  - name: "relate-plain"
    purpose: "List unique relative file paths that reference or import the target file"
    usage: "uv run python relate.py --path <path> --plain [options]"
    options:
      - "--path, -p <path> : Target script path to search for (required)"
      - "--plain : Output clean list of unique referencing file paths"
      - "--strict, -s : Only match full path or filename"
    example: "uv run python relate.py --path duckdb_explorer.py --plain"

  - name: "relate-json"
    purpose: "Emit structured JSON payload of all references, lines, and match types for agent consumption"
    usage: "uv run python relate.py --path <path> --json [options]"
    options:
      - "--path, -p <path> : Target script path to search for (required)"
      - "--json, -j : Output machine-readable JSON data"
      - "--strict, -s : Only match full path or filename"
    example: "uv run python relate.py --path tree.py --json"
