meta:
  manual_version: "2.1"
  manual_changelog:
    - version: "1.0"
      date: "2026-09-04"
      note: Initial full hand-transcribed manual (every flag's name/type/default/help duplicated from source).
    - version: "2.0"
      date: "2026-09-04"
      note: >
        Restructured per gap analysis. Key changes: (1) `describe --pretty`
        is now the declared canonical source for flag names/defaults/help/
        choices — this file no longer duplicates that, only adds what
        `describe` cannot express; (2) numeric/pattern constraints moved
        from prose into JSON-Schema-style keys (minimum/maximum/pattern);
        (3) --dry-run, mutation classification, and determinism are each
        defined once under shared_concepts instead of repeated per command;
        (4) added environment_variables table, rationale for tunable
        defaults ("voodoo constants"), known validation gaps in the
        underlying code, hardcoded/non-configurable behavior, cost/perf
        notes, and negative (failure-path) examples; (5) unified `aliases`
        as a list on every flag instead of a mix of `short`/`aliases`.
    - version: "2.1"
      date: "2026-09-04"
      note: >
        Updated against tradebook_tool_v4.1.0. Key changes: (1) `describe
        --pretty` now emits per-flag `constraint` objects directly (sourced
        from the same argparse Action objects the flags/defaults/help
        already come from), so this file's hand-copied `constraints:`
        blocks under commands.tradebook / commands.smartgrid are GONE —
        describe is now genuinely the sole source for those, not just the
        declared one; (2) commands.smartgrid.known_validation_gaps is GONE
        — --max-charts/--min-candles/--px-per-candle are now range-checked
        in code the same way tradebook's equivalents are; (3)
        error_envelope updated: argparse-level failures (bad --strategy
        choice, missing required flags, mutually-exclusive violations) now
        also emit the JSON envelope when --json is present, closing a gap
        where only post-parse validation errors used to get it; (4)
        common_pitfalls trimmed to match — the smartgrid-validation-gap and
        constraints-duplication pitfalls no longer apply.
  canonical_flag_source: "tradebook_tool.py describe --pretty"
  drift_warning: >
    If anything in this file's flag names/defaults/choices/constraints ever
    disagrees with a live `describe --pretty` call against the actual
    script version you're running, TRUST describe. This file is reviewed by
    a human, not generated from source, so it can go stale; describe
    cannot. As of v2.1, constraints (minimum/maximum/pattern/enum) are
    sourced from describe too, not just flags/defaults/help/choices — see
    canonical_flag_source note on commands.tradebook and commands.smartgrid
    below.
  tool_version_verified_against: "4.1.0"

tool_name: tradebook_tool
tool_file: tradebook_tool_v4.py
purpose: >
  Combined CLI with two independent capabilities: (1) generate SmartGrid-
  packed candlestick "trade playbook" PNGs from a DuckDB database of trades,
  and (2) run the chart-packing layout engine standalone (no DB, no
  rendering). Built for a coding agent as much as a human: stdout is
  reserved for machine-readable JSON, all logs go to stderr, exit codes are
  semantic, and the tool can describe its own contract (see `describe`).

agent_quickstart:
  - "Call `tradebook_tool.py describe --pretty` once per session for authoritative flags/defaults/choices — treat it as the schema, and this file as the usage guide layered on top of that schema."
  - "For tradebook, always run --dry-run first to validate --sql/--ohlcv-* cheaply (see shared_concepts.dry_run) before paying render cost."
  - "Always pass --json so results land on stdout as parseable JSON; check the process exit code, not just stdout content, to know if a run succeeded (see exit_codes)."
  - "On EXIT_UNEXPECTED, retry once with --debug (before the subcommand) to get a full traceback on stderr."
  - "Before choosing --strategy optimal on a large batch, read commands.smartgrid.cost_notes — it's O(n^2) in chart count."

invocation: "python tradebook_tool_v4.py [global flags] <command> [command flags]"
global_flags_placement_note: >
  --debug and --log-json belong to the TOP-LEVEL parser and MUST appear
  BEFORE the subcommand name: `tradebook_tool.py --debug tradebook ...`,
  not `tradebook_tool.py tradebook --debug ...`.

environment_variables:
  - name: TRADEBOOK_DB
    used_by: [tradebook]
    equivalent_to: --db
    description: Fallback DuckDB path when --db is not passed. --db (if given) takes precedence.
  - name: TRADEBOOK_DEBUG
    used_by: [global]
    equivalent_to: --debug
    accepted_value: "1"
    description: Same effect as passing --debug — full traceback to stderr on unexpected errors.

exit_codes:
  EXIT_OK: 0
  EXIT_UNEXPECTED: 1        # unclassified error; rerun with --debug for a traceback
  EXIT_BAD_INPUT: 2         # bad flags, bad --sql, bad --candles, range violations, etc.
  EXIT_DB_NOT_FOUND: 3      # --db path does not exist on disk
  EXIT_INTERRUPTED: 130     # Ctrl-C / SIGINT

error_envelope:
  description: >
    On failure, if --json was passed, a single-line JSON object is printed
    to STDERR (not stdout): {"status": "error", "code": ..., "message": ...}.
    "code" is one of: db_not_found, bad_input, unexpected. Without --json,
    the same message goes to stderr as a plain log line instead.
  example: '{"status": "error", "code": "bad_input", "message": "--pad must be >= 0, got -3"}'

# ---------------------------------------------------------------------------
# Concepts shared across commands, defined once instead of repeated per
# command (v1 defined --dry-run separately, slightly differently, under
# both tradebook and smartgrid).
# ---------------------------------------------------------------------------
shared_concepts:

  dry_run:
    flag: --dry-run
    applies_to: [tradebook, smartgrid]
    common_behavior: >
      Runs full input validation and full computation of "how much work
      would happen", but skips the final write/render step. Safe to call
      repeatedly; never mutates the filesystem.
    per_command_differences:
      tradebook: >
        Additionally skips fetching per-trade OHLCV candle windows entirely
        (no window-fetch queries run) and never imports matplotlib/
        mplfinance/PIL — only duckdb+pandas load. Only the trade-selection
        --sql itself is executed, to get an accurate trades_found count.
      smartgrid: >
        Computes the COMPLETE layout (packing + fill + pagination) using
        --candles if given, else the built-in dummy dataset — it does NOT
        skip computation, only the output-file write. (v3 had a bug where
        --candles was silently ignored and the dummy dataset substituted on
        --dry-run; fixed in v4 — --candles is honored on dry-run too.)

  mutation_classification:
    description: >
      Whether a call can write to disk, for agents planning retries/rollback.
    pure_no_filesystem_writes:
      - "describe (any flags)"
      - "tradebook --dry-run"
      - "smartgrid --dry-run"
    writes_output_files:
      - command: tradebook
        when: "--dry-run not passed"
        writes: "PNG file(s) under --output or --output-dir; creates directories as needed"
        overwrite_behavior: "Overwrites existing files at the resolved path without confirmation."
      - command: smartgrid
        when: "--dry-run not passed"
        writes: "One JSON file at --output; creates parent directories as needed"
        overwrite_behavior: "Overwrites an existing file at that path without confirmation."

  determinism: >
    All computation (layout packing/fill/pagination, SL/TP resolution,
    rendering) is a pure function of its inputs plus whatever the DuckDB
    database currently contains. Re-running with an unchanged database and
    identical flags/--sql produces the same trades_found / layout / exit
    reasons every time — safe for an agent to treat as cacheable, though
    PNG bytes themselves are not guaranteed byte-identical across runs
    (matplotlib/PIL encoding is not a documented-stable output format).

commands:

  # ==========================================================================
  tradebook:
    canonical_flag_source: "describe --pretty -> subcommands.tradebook"
    summary: >
      Run an arbitrary --sql query against a DuckDB database to select
      trades, fetch each trade's OHLCV candle window, lay it out via the
      SmartGrid engine, and render one or more paginated PNG canvases of
      candlestick charts (mplfinance) with entry/SL/TP/custom reference
      lines.
    when_to_use:
      - "You have a DuckDB file with a trades table/view and an OHLCV candles table, and want visual playbook PNGs of a filtered set of trades (e.g. all losers, all trades on a symbol, a date range)."
      - "You want to sanity-check a trade-selection SQL query and its column mapping before spending render time (--dry-run)."
    when_not_to_use:
      - "No DuckDB database — use `smartgrid` directly to test/visualize the layout algorithm on arbitrary candle counts."
    requires: [duckdb, pandas, mplfinance, matplotlib, Pillow]
    dependency_loading: >
      Two-stage lazy import. duckdb+pandas load for every invocation
      (including --dry-run). mplfinance/matplotlib/PIL load only when an
      actual render will happen (never on --dry-run).
    mutation: "see shared_concepts.mutation_classification"
    cost_notes: >
      Per trade: at most 2 DuckDB queries when SL/TP-scanning
      (resolve_exit_and_window), or 3 when exit_time/exit_price are
      explicitly provided (fetch_trade_window). Wall-clock for a render run
      is typically dominated by matplotlib/mplfinance figure generation,
      not the DB queries. Canvas count = ceil(trades_found / --max-charts),
      approximately (actual packing can produce more/fewer rows per canvas
      depending on --strategy and --row-capacity).

    mutually_exclusive_groups:
      - flags: [--sql, --sql-file]
        required: true
        note: "Exactly one of these two must be given; argparse enforces this before any DB connection is opened."

    flags_index:
      description: >
        Convenience list for quick scanning. Authoritative defaults/help
        text/choices: run `describe --pretty`. Constraints below ARE
        authoritative (validated in code, not just argparse) since describe
        does not currently surface them.
      items:
        - {name: --db, aliases: [], type: string, format: file_path, required: "conditional (or TRADEBOOK_DB env var)"}
        - {name: --sql, aliases: [], type: string, format: sql_select, required: "see mutually_exclusive_groups"}
        - {name: --sql-file, aliases: [], type: string, format: file_path, required: "see mutually_exclusive_groups"}
        - {name: --sql-params, aliases: [], type: string, format: json_array, required: false}
        - {name: --ohlcv-table, aliases: [], type: string, format: sql_identifier, required: true}
        - {name: --ohlcv-time-col, aliases: [], type: string, format: sql_identifier, required: false}
        - {name: --ohlcv-open-col, aliases: [], type: string, format: sql_identifier, required: false}
        - {name: --ohlcv-high-col, aliases: [], type: string, format: sql_identifier, required: false}
        - {name: --ohlcv-low-col, aliases: [], type: string, format: sql_identifier, required: false}
        - {name: --ohlcv-close-col, aliases: [], type: string, format: sql_identifier, required: false}
        - {name: --ohlcv-volume-col, aliases: [], type: string, format: "sql_identifier or empty string", required: false}
        - {name: --pad, aliases: ["-p"], type: integer, required: false}
        - {name: --exit-lookahead, aliases: [], type: integer, required: false}
        - {name: --hline-cols, aliases: [], type: string, format: csv, required: false}
        - {name: --row-capacity, aliases: ["-r"], type: integer, required: false}
        - {name: --max-charts, aliases: ["-m"], type: integer, required: false}
        - {name: --strategy, aliases: [], type: enum, required: false}
        - {name: --run-name, aliases: [], type: string, required: false}
        - {name: --output, aliases: [], type: string, format: file_path, required: false}
        - {name: --output-dir, aliases: [], type: string, format: dir_path, required: false}
        - {name: --dry-run, aliases: [], type: boolean, required: false}
        - {name: --json, aliases: [], type: boolean, required: false}
        - {name: --quiet, aliases: [], type: boolean, required: false}

    constraints:
      # Validated explicitly in _run_tradebook before any DB/layout work.
      # JSON-Schema-style keys, authoritative (source of truth for these
      # specific bounds, since `describe` does not currently surface them).
      --pad: {type: integer, minimum: 0}
      --exit-lookahead: {type: integer, minimum: 1}
      --row-capacity: {type: integer, exclusiveMinimum: 0}
      --max-charts: {type: integer, minimum: 1}
      --ohlcv-table: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-time-col: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-open-col: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-high-col: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-low-col: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-close-col: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      --ohlcv-volume-col: {type: string, pattern: "^($|[A-Za-z_][A-Za-z0-9_]*$)", note: "empty string explicitly means 'no volume column'"}
      --strategy: {type: string, enum: [optimal, wordwrap, bestfit]}

    flag_notes:
      description: >
        Non-obvious semantics and rationale for tunable defaults — the
        kind of context argparse/`describe` structurally cannot carry.
      items:
        - flag: --exit-lookahead
          rationale: >
            Candle-count based, not time-based, so the same numeric value
            covers very different real time depending on your OHLCV bar
            size (288 candles = 1 day on 5m bars, but only 4.8 hours on
            1m bars). Set it relative to your table's bar size, don't
            treat 288 as a universal constant.
        - flag: --row-capacity
          rationale: >
            Trade-off between chart width/readability and rows-per-canvas
            (page count). The default of 350 assumes the default zoom
            (px_per_candle is fixed at 3.0 for tradebook, not exposed as a
            flag) — increase it if your typical trade windows run wide.
        - flag: --ohlcv-volume-col
          rationale: >
            Must be explicitly set to '' (empty string) to opt out of a
            volume column. Omitting the flag entirely does NOT disable
            volume — it falls back to the default 'volume'.
        - flag: --sql-params
          rationale: >
            Binds VALUES only, positionally, to `?` placeholders in --sql.
            Table/column names (--ohlcv-table, --ohlcv-*-col) cannot be
            parameterized this way — they're validated as plain identifiers
            instead, since SQL doesn't allow parameterizing identifiers.
        - flag: --strategy
          rationale: "See commands.smartgrid.flag_notes for --strategy — identical engine, identical trade-offs, used here via SmartGridEngine internally."

    side_effects:
      - "Creates --output-dir if missing."
      - "On multi-page (paginated) output, creates a subdirectory named after the output filename's stem, and writes p1.png, p2.png, ... inside it."
      - "Overwrites existing PNG file(s) at the resolved path without confirmation."

    hardcoded_not_configurable:
      - "Output format is always PNG — no SVG/PDF option exists."
      - "Chart style is a fixed mplfinance 'charles'-based style with small fonts (6pt title, 5.5pt ticks); not exposed via any flag."
      - "--hline-cols reference-line colors cycle through a fixed 6-color palette; colors repeat if more than 6 hline columns are supplied."
      - "px_per_candle (chart zoom) is fixed at 3.0 for tradebook; only smartgrid exposes --px-per-candle as a flag."

    trade_column_contract:
      description: >
        The result set of --sql (or --sql-file) is matched case-insensitively
        against these column names. Alias with AS as needed.
      required_columns:
        - name: entry_time
          type: timestamp
          description: Timestamp the trade was entered.
        - name: entry_price
          type: float
          description: Entry price.
      optional_columns:
        - name: trade_id
          description: "Shown in chart title. Default: row position (1-based)."
        - name: sl_price
          type: float
          description: Stop-loss price -> rendered as a red horizontal line.
        - name: tp_price
          type: float
          description: Take-profit price -> rendered as a green horizontal line.
        - name: exit_time
          type: timestamp
          description: Explicit exit timestamp. If present (with exit_price), SKIPS the SL/TP scan entirely.
        - name: exit_price
          type: float
          description: Explicit exit price, used together with exit_time.
        - name: exit_reason
          type: string
          description: Free text shown in the chart title (e.g. "SL", "TP", "TIME", "PROVIDED", "NO_DATA", "N/A").
        - name: pnl
          type: float
          description: Drives WIN (green) / LOSS (red) title color coding. If absent, title shows N/A in gray.
      arbitrary_columns: >
        Any other column returned by --sql can be drawn as a horizontal
        reference line via --hline-cols, e.g. --hline-cols s1,r1,vwap.
      no_exit_fallback: >
        If neither exit_time/exit_price NOR sl_price/tp_price is supplied,
        the chart centers on entry_time alone with no computed exit
        (exit_reason will be "N/A" or "NO_DATA").

    exit_resolution_semantics:
      - "If exit_time is present and non-null in the row: uses it directly (with exit_price, or falls back to entry_price if exit_price missing). exit_reason defaults to 'PROVIDED' if not supplied."
      - "Else, if sl_price and/or tp_price present: scans forward up to --exit-lookahead candles; whichever of SL/TP is hit first wins (ties go to SL). exit_reason becomes 'SL' or 'TP'."
      - "Else if the scan window runs out with no hit: exit_reason becomes 'TIME', exit_price = close of the last scanned candle."
      - "Else if sl_price and tp_price are both absent: exit_reason becomes 'N/A', chart centers on entry only."
      - "Else if no future data exists at all past entry: exit_reason becomes 'NO_DATA'."

    result_envelope:
      description: JSON object printed to stdout when --json is passed.
      fields:
        status: '"ok"'
        trades_found: "int — number of rows returned by --sql"
        canvases_generated: "int — number of PNG pages written (0 on --dry-run or 0 trades)"
        output_files: "list[str] — paths of PNGs actually written"
        run_name: "string — echoes --run-name"
        dry_run: "bool"

    examples:
      - description: Validate a query and column mapping cheaply before rendering.
        command: >
          tradebook_tool.py tradebook --db trades.duckdb
          --sql "SELECT trade_id, entry_time, entry_price, sl_price, tp_price, pnl FROM v_all_trades WHERE pnl < 0 ORDER BY entry_time LIMIT 12"
          --ohlcv-table ohlcv_5m --dry-run --json
      - description: Full render of losing trades with default 5m OHLCV column names.
        command: >
          tradebook_tool.py tradebook --db trades.duckdb
          --sql "SELECT trade_id, entry_time, entry_price, sl_price, tp_price, pnl FROM v_all_trades WHERE pnl < 0 ORDER BY entry_time LIMIT 12"
          --ohlcv-table ohlcv_5m --json
      - description: Custom OHLCV column names, SQL from a file, extra reference lines.
        command: >
          tradebook_tool.py tradebook --db trades.duckdb --sql-file query.sql
          --ohlcv-table ohlcv_1m --ohlcv-time-col ts --hline-cols s1,r1,vwap --json
      - description: Debug an unexpected failure.
        command: >
          tradebook_tool.py --debug tradebook --db trades.duckdb --sql-file query.sql
          --ohlcv-table ohlcv_1m --json

    negative_examples:
      - description: Nonexistent --db path fails fast with EXIT_DB_NOT_FOUND, before any query runs.
        command: 'tradebook_tool.py tradebook --db missing.duckdb --sql "SELECT 1 AS entry_time, 1 AS entry_price" --ohlcv-table ohlcv_5m --json'
        expected_exit_code: 3
        expected_stderr_code: db_not_found
      - description: A nonexistent --ohlcv-table is caught upfront as bad input, not a raw DuckDB traceback.
        command: 'tradebook_tool.py tradebook --db trades.duckdb --sql "SELECT now() AS entry_time, 1.0 AS entry_price" --ohlcv-table does_not_exist --json'
        expected_exit_code: 2
        expected_stderr_code: bad_input
      - description: --sql result missing a required column (entry_price) is rejected with the missing-column list, not a KeyError deep in rendering.
        command: 'tradebook_tool.py tradebook --db trades.duckdb --sql "SELECT now() AS entry_time" --ohlcv-table ohlcv_5m --json'
        expected_exit_code: 2
        expected_stderr_code: bad_input
      - description: A write query is rejected before touching the read_only DuckDB connection.
        command: 'tradebook_tool.py tradebook --db trades.duckdb --sql "DELETE FROM v_all_trades" --ohlcv-table ohlcv_5m --json'
        expected_exit_code: 2
        expected_stderr_code: bad_input

  # ==========================================================================
  smartgrid:
    canonical_flag_source: "describe --pretty -> subcommands.smartgrid"
    summary: >
      Standalone chart-packing layout engine. Given a list of "candle
      counts" (one int per chart), computes rows (packing), fills leftover
      row space by bounded proportional extension, and paginates rows into
      canvases — pure Python, zero I/O, zero external dependencies. Starts
      and returns instantly.
    when_to_use:
      - "Testing/tuning layout parameters (row capacity, packing strategy, max charts per canvas) without touching a real database."
      - "Understanding or debugging how tradebook's internal layout stage will behave for a given distribution of trade window sizes, by feeding it representative candle counts directly."
    when_not_to_use:
      - "You want actual rendered PNGs of real trades — use `tradebook`; this command never touches matplotlib/mplfinance and never plots real OHLCV data."
    requires: []  # pure Python 3.9+, no external dependencies
    mutation: "see shared_concepts.mutation_classification"
    cost_notes: >
      pack_wordwrap and pack_bestfit are effectively O(n) / O(n log n) in
      chart count. pack_optimal ("optimal", the default) is an O(n^2)
      dynamic program over row breakpoints — fine for tens to a few hundred
      charts per canvas, but scales quadratically, so for very large
      batches (thousands of charts) prefer --strategy wordwrap unless
      packing quality genuinely matters more than compute time.

    flags_index:
      description: >
        Convenience list for quick scanning. Authoritative defaults/help
        text/choices: run `describe --pretty`. Constraints below ARE
        authoritative since describe does not currently surface them.
      items:
        - {name: --candles, aliases: ["--candels", "-c"], type: array<string>, required: false}
        - {name: --row-capacity, aliases: ["-r"], type: integer, required: false}
        - {name: --px-per-candle, aliases: [], type: number, required: false}
        - {name: --gap, aliases: [], type: integer, required: false}
        - {name: --max-charts, aliases: [], type: integer, required: false}
        - {name: --max-extension, aliases: [], type: number, required: false}
        - {name: --min-candles, aliases: [], type: integer, required: false}
        - {name: --strategy, aliases: [], type: enum, required: false}
        - {name: --dry-run, aliases: [], type: boolean, required: false}
        - {name: --output, aliases: [], type: string, format: file_path, required: false}
        - {name: --json, aliases: [], type: boolean, required: false}
        - {name: --quiet, aliases: [], type: boolean, required: false}

    constraints:
      # Only what validate_input() actually enforces. See known_validation_gaps
      # below for flags that are NOT checked, despite looking like they should be.
      --candles: {type: array, items: {type: integer, minimum: 1}, minItems: 1}
      --row-capacity: {type: integer, exclusiveMinimum: 0}
      --gap: {type: integer, minimum: 0}
      --max-extension: {type: number, minimum: 1.0}
      --strategy: {type: string, enum: [optimal, wordwrap, bestfit]}

    known_validation_gaps:
      description: >
        Flags that look like they should be range-checked (and are, for the
        equivalent concept under `tradebook`) but are NOT validated by
        smartgrid's CLI layer or by validate_input(). Passing an
        out-of-range value here will not raise a clean EXIT_BAD_INPUT the
        way --pad/--exit-lookahead/--row-capacity/--max-charts do under
        `tradebook` — behavior for these is unspecified/library-internal.
      items:
        - flag: --max-charts
          issue: "Not range-checked. A value <= 0 is passed straight to paginate() without an upfront error."
        - flag: --min-candles
          issue: "Not range-checked. A negative value is passed straight to fill_row()'s max(min_candles, ...) floor without an upfront error."
        - flag: --px-per-candle
          issue: "Not range-checked. A zero/negative value silently produces zero/negative x_px and width_px in the layout output."

    flag_notes:
      items:
        - flag: --strategy
          rationale: >
            optimal = order-preserving DP minimizing total leftover^3
            across all rows (recommended default; see cost_notes for its
            O(n^2) scaling). wordwrap = greedy, order-preserving, simplest/
            safest, O(n). bestfit = Best-Fit-Decreasing bin packing — the
            only strategy that REORDERS charts; avoid it if input order
            carries meaning (e.g. chronological trade order), since the
            output's chart order will not match the input's.
        - flag: --max-extension
          rationale: >
            Purely a visual-balance cap on how far Stage B will stretch a
            narrow chart to fill row leftover space; has no effect on which
            candles are selected, only on display width.
        - flag: --candles
          rationale: >
            Accepts loose formats (space-separated, comma-separated, or
            JSON-ish bracketed lists) because agents often paste JSON-like
            output. Any non-positive-integer token raises EXIT_BAD_INPUT
            listing the offending token(s) — nothing is silently dropped
            (this was a v3 bug: bad tokens used to vanish silently).

    result_envelope:
      description: JSON object printed to stdout when --json is passed (otherwise the full layout dict is printed, pretty-indented).
      fields:
        status: '"ok"'
        dry_run: "bool"
        total_charts: "int — number of input candle counts"
        canvases_generated: "int — number of output canvases/pages"
        output_file: "string or null — path written, or null on --dry-run"
        layout: "the full nested layout object (config, canvas_width_px, canvases[].rows[].charts[])"

    layout_object_shape:
      description: Shape of the full (non-envelope) layout dict, returned either directly (no --json) or nested under "layout" (with --json).
      fields:
        config: "echoes the resolved LayoutConfig used"
        canvas_width_px: "float — row_capacity_candles * px_per_candle"
        total_charts: "int"
        canvases:
          - canvas_index: "int"
            rows:
              - row: "int"
                charts:
                  - index: "int — original position in the input --candles list"
                    original_candles: "int"
                    displayed_candles: "int — after Stage B fill"
                    extra_candles_added: "int — displayed_candles - original_candles"
                    x_px: "float — horizontal offset within the row"
                    width_px: "float"
                    capped: "bool — true if max_extension_ratio limited the fill"
                    overflow: "bool — true if this chart alone exceeded row_capacity_candles and got its own row unscaled"

    examples:
      - description: Quick sanity check with the built-in dummy dataset.
        command: "tradebook_tool.py smartgrid --dry-run --json"
      - description: Lay out a specific set of chart sizes with a wider row.
        command: "tradebook_tool.py smartgrid --candles 200 150 350 25 --row-capacity 400"
      - description: Compare packing strategies on the same input.
        command: "tradebook_tool.py smartgrid --candles 200 150 350 25 45 500 --strategy bestfit --dry-run --json"

    negative_examples:
      - description: A non-numeric token in --candles is rejected with the offending token named, not silently dropped.
        command: "tradebook_tool.py smartgrid --candles 200 15o 350 --dry-run --json"
        expected_exit_code: 2
        expected_stderr_code: bad_input
      - description: An empty --candles list (all tokens filtered out) is rejected rather than silently falling back to the dummy dataset.
        command: "tradebook_tool.py smartgrid --candles \"\" --dry-run --json"
        expected_exit_code: 2
        expected_stderr_code: bad_input

  # ==========================================================================
  describe:
    canonical_flag_source: "n/a — this command IS the canonical source for the other two"
    summary: >
      Emits a machine-readable JSON dump of this tool's own contract:
      subcommands and their flags/defaults/help/choices, exit codes, and
      the TRADE COLUMN CONTRACT. Pure Python, no I/O — starts and returns
      instantly. Prefer this over this manual for anything it covers.
    when_to_use:
      - "First call in a fresh agent session, to introspect the tool's current flag set programmatically, guarding against this manual having drifted from the actual installed script version."
    flags_index:
      items:
        - {name: --pretty, aliases: [], type: boolean, required: false}
    output_shape:
      tool: '"tradebook_tool"'
      version: "string"
      exit_codes: "object — name to int, see exit_codes above"
      subcommands:
        tradebook: "{description, flags: [{flags, dest, help, required, default, choices}]}"
        smartgrid: "{description, flags: [...]}"
      trade_column_contract: "required_columns, optional_columns, reference_lines — mirrors commands.tradebook.trade_column_contract above"
      global_flags: "--debug and --log-json descriptions"
    examples:
      - description: Get the full contract as compact JSON.
        command: "tradebook_tool.py describe"
      - description: Get the full contract, human-readable.
        command: "tradebook_tool.py describe --pretty"

common_pitfalls:
  - "--debug and --log-json go BEFORE the subcommand name, not after (top-level parser flags)."
  - "--sql-params binds VALUES via `?` placeholders only, positionally; table/column names (--ohlcv-table, --ohlcv-*-col) are validated as plain identifiers instead, since SQL doesn't allow parameterizing identifiers."
  - "tradebook --dry-run validates --sql/--ohlcv-* and counts trades, but does NOT fetch candle windows — a downstream --ohlcv-*-col typo that only breaks a later join may not surface until a real run."
  - "smartgrid --dry-run DOES honor --candles (v3 bug, fixed in v4) — it only skips the output-file write, not the computation. See shared_concepts.dry_run."
  - "An empty --sql result set (0 trades) returns status ok with trades_found=0 — NOT an error."
  - "Error JSON envelopes on failure are printed to STDERR, not stdout, even with --json — parse stdout for success, stderr for the error envelope."
  - "--ohlcv-volume-col must be set to an empty string '' (not omitted) to explicitly signal 'no volume column available'; omitting it just uses the default 'volume'."
  - "smartgrid's --max-charts, --min-candles, and --px-per-candle are NOT range-validated the way tradebook's equivalents are — see commands.smartgrid.known_validation_gaps before assuming a bad value will fail cleanly."
  - "--strategy bestfit reorders charts; it's the only strategy where output chart order can differ from input order."
