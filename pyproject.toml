[project]
name = "ta-patterns-book"
version = "0.1.0"
description = "Technical Analysis Pattern Recognition Book, DuckDB Pattern Memory & Real-Market Example Hunter CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "mplfinance>=0.12.10b0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "ta-patterns>=1.1.1",
]

[project.scripts]
ta-patterns-book = "ta_patterns_book.loss_profile.cli:main"
loss-profile = "ta_patterns_book.loss_profile.cli:main"
trade-book-charts = "trade_book_charts.cli:main"
trade-view = "trade_book_charts.cli:main"
tradebook-tool = "trade_book_charts.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["Core"]
